name: Release

on:
    push:
        branches: [master]

permissions: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
    CI: true
    INTEGRATION_ENVIRONMENT_ID: ${{ secrets.INTEGRATION_ENVIRONMENT_ID }}
    INTEGRATION_MANAGEMENT_API_KEY: ${{ secrets.INTEGRATION_MANAGEMENT_API_KEY }}

jobs:
    release:
        timeout-minutes: 15
        runs-on: ubuntu-latest
        permissions:
            # Required for OIDC publishing to npm
            id-token: write
            # Required for pushing release commits & tags and opening the "Version Packages" PR
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v4
              with:
                # changesets/action pushes release commits and tags through the GitHub API with its
                # github-token input, so no token needs to sit in .git/config while install/build scripts run.
                persist-credentials: false
            - name: Install pnpm
              uses: pnpm/action-setup@v4
            - name: Use Node.js from .nvmrc file
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  registry-url: 'https://registry.npmjs.org'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm ci:check
            - run: pnpm test:integration

            # Opens / updates the "Version Packages" PR when there are pending changesets.
            # When that PR is merged, publishes every package whose version is not yet on npm.
            - name: Create release PR or publish to npm
              uses: changesets/action@v2
              with:
                  commit-message: "changeset: update versions"
                  pr-title: "changeset: update versions"
                  publish-script: pnpm changeset:publish
